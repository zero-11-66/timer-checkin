<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f6f2e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="时间打卡簿">
<title>时间打卡簿</title>
<style>
  :root {
    --paper: #f6f2e8;
    --card: #fffdf8;
    --ink: #24342b;
    --muted: #7d877d;
    --line: #e4ddcd;
    --forest: #2f5d46;
    --forest-soft: #dce8dd;
    --orange: #d9773d;
    --orange-soft: #f6e2d3;
    --shadow: 0 12px 40px rgba(52, 61, 45, .08);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    background:
      radial-gradient(circle at 8% 4%, rgba(217, 119, 61, .10), transparent 28rem),
      radial-gradient(circle at 92% 0%, rgba(47, 93, 70, .12), transparent 30rem),
      var(--paper);
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; }
  button { color: inherit; }
  .app { max-width: 1120px; margin: 0 auto; padding: 38px 22px 70px; }

  header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 28px; }
  .eyebrow { letter-spacing: .22em; font-size: 11px; font-weight: 700; color: var(--orange); margin: 0 0 8px; }
  h1 { font-family: "STSong", "Songti SC", "SimSun", serif; font-size: clamp(30px, 4.2vw, 46px); letter-spacing: .06em; margin: 0; font-weight: 700; }
  .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .today-stamp { text-align: right; flex: none; }
  .today-stamp strong { font-family: "STSong", "Songti SC", serif; font-size: 30px; display: block; line-height: 1.1; }
  .today-stamp span { font-size: 12px; color: var(--muted); letter-spacing: .1em; }

  .layout { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(320px, .95fr); gap: 22px; align-items: start; }
  .column { display: grid; gap: 22px; }
  .card { background: var(--card); border: 1px solid rgba(228, 221, 205, .9); border-radius: var(--radius); box-shadow: var(--shadow); padding: 26px; }
  .card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 18px; }
  .card-head h2 { font-family: "STSong", "Songti SC", serif; font-size: 20px; margin: 0; letter-spacing: .05em; }
  .card-head .hint { font-size: 12px; color: var(--muted); }
  #listRange { max-width: 62%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* Timer */
  .timer-card { position: relative; overflow: hidden; color: #f8f4e9; background: linear-gradient(145deg, #2b523d, #203b2d); border: 0; }
  .timer-card::after { content: ""; position: absolute; width: 230px; height: 230px; border-radius: 50%; border: 1px solid rgba(255,255,255,.10); right: -70px; top: -90px; box-shadow: 0 0 0 34px rgba(255,255,255,.035), 0 0 0 68px rgba(255,255,255,.025); pointer-events: none; }
  .timer-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: relative; z-index: 1; }
  .status { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; letter-spacing: .12em; color: rgba(248,244,233,.72); }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(248,244,233,.38); }
  .is-running .status-dot { background: #f2a56f; animation: pulse 1.8s ease-in-out infinite; }
  .is-paused .status-dot { background: #e6c57e; animation: none; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 7px rgba(242,165,111,.14); } }
  .timer-display { font-variant-numeric: tabular-nums; font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace; font-weight: 300; font-size: clamp(48px, 8.2vw, 76px); letter-spacing: -.055em; line-height: 1; margin: 34px 0 8px; position: relative; z-index: 1; }
  .timer-task { min-height: 22px; color: rgba(248,244,233,.72); font-size: 14px; margin-bottom: 26px; position: relative; z-index: 1; overflow-wrap: anywhere; }
  .timer-form { position: relative; z-index: 1; }
  .input-wrap { display: flex; gap: 10px; }
  .task-input { flex: 1; min-width: 0; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.08); color: #fffdf8; border-radius: 13px; padding: 13px 15px; outline: none; transition: border-color .2s, background .2s; }
  .task-input::placeholder { color: rgba(248,244,233,.45); }
  .task-input:focus { border-color: rgba(242,165,111,.8); background: rgba(255,255,255,.12); }
  .btn { border: 0; border-radius: 13px; cursor: pointer; font-weight: 600; padding: 13px 20px; transition: transform .15s, opacity .2s, background .2s; white-space: nowrap; }
  .btn:active { transform: scale(.98); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-light { background: #f2a56f; color: #2b2119; }
  .btn-light:hover:not(:disabled) { background: #f7b98d; }
  .btn-ghost { background: transparent; color: rgba(248,244,233,.76); border: 1px solid rgba(255,255,255,.22); padding: 13px 15px; }
  .btn-ghost:hover { background: rgba(255,255,255,.07); }
  .btn-ghost.armed { color: #ffd0bd; border-color: rgba(255,160,130,.65); background: rgba(217,119,61,.14); }
  .quick { display: grid; gap: 7px; margin-top: 13px; position: relative; z-index: 1; min-height: 27px; }
  .quick-row { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
  .quick-label { flex: none; font-size: 11px; color: rgba(248,244,233,.45); margin-right: 2px; }
  .quick-item { display: inline-flex; align-items: stretch; max-width: 210px; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.05); border-radius: 999px; overflow: hidden; }
  .quick-item.is-favorite { border-color: rgba(242,193,120,.42); background: rgba(242,165,111,.10); }
  .quick-name { min-width: 0; max-width: 148px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border: 0; background: transparent; color: rgba(248,244,233,.84); padding: 5px 4px 5px 11px; font-size: 12px; cursor: pointer; }
  .quick-name:hover { color: #fff; }
  .quick-action { flex: none; border: 0; border-left: 1px solid rgba(255,255,255,.10); background: transparent; color: rgba(248,244,233,.42); padding: 5px 7px; font-size: 11px; line-height: 1.2; cursor: pointer; }
  .quick-action.star:hover, .quick-action.star.on { color: #f2c578; }
  .quick-action.remove { font-size: 14px; padding: 3px 8px 5px; }
  .quick-action.remove:hover { color: #ffb4a2; background: rgba(217,119,61,.12); }
  .running-actions { display: flex; gap: 10px; }
  .running-actions .btn:first-child { flex: 1; }
  #pauseBtn { min-width: 74px; }
  .is-paused #pauseBtn { color: #ffd9a0; border-color: rgba(242,196,117,.58); }
  .saved-tip { color: rgba(248,244,233,.52); font-size: 12px; margin-top: 13px; position: relative; z-index: 1; }

  /* Calendar */
  .calendar-nav { display: flex; align-items: center; gap: 8px; }
  .icon-btn { width: 30px; height: 30px; border-radius: 9px; border: 1px solid var(--line); background: transparent; cursor: pointer; color: var(--muted); display: grid; place-items: center; padding: 0; font-size: 17px; }
  .icon-btn:hover { background: var(--paper); color: var(--ink); }
  .month-label { min-width: 104px; text-align: center; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .weekdays, .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .weekdays { margin: 3px 0 7px; }
  .weekdays span { text-align: center; font-size: 10px; color: var(--muted); letter-spacing: .08em; padding: 3px 0; }
  .day { position: relative; aspect-ratio: 1 / .92; min-height: 40px; border: 1px solid transparent; border-radius: 11px; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; color: #8d948c; padding: 3px 2px; transition: background .15s, border-color .15s; }
  .day:hover { background: var(--paper); }
  .day.outside { opacity: .3; }
  .day.today .day-num { color: var(--orange); font-weight: 800; }
  .day.selected { border-color: var(--forest); background: #fff; box-shadow: 0 2px 10px rgba(47,93,70,.11); }
  .day.has-record { color: var(--ink); font-weight: 600; }
  .day.has-record::before { content: ""; position: absolute; inset: 3px; border-radius: 9px; background: var(--forest-soft); z-index: 0; }
  .day.level-2::before { background: #c2dac8; }
  .day.level-3::before { background: #a4c9ae; }
  .day.selected::before { background: #e7f0e7; }
  .day > * { position: relative; z-index: 1; }
  .day-num { line-height: 1; }
  .day-marks { display: flex; gap: 2px; height: 4px; align-items: center; }
  .day-mark { width: 3px; height: 3px; border-radius: 50%; background: var(--forest); opacity: .65; }
  .day-count { font-size: 8px; color: rgba(36,52,43,.55); line-height: 1; }
  .legend { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 16px; font-size: 11px; color: var(--muted); flex-wrap: wrap; }
  .legend-scale { display: flex; align-items: center; gap: 5px; }
  .swatch { width: 11px; height: 11px; border-radius: 3px; background: var(--forest-soft); }
  .swatch:nth-child(3) { background: #c2dac8; }
  .swatch:nth-child(4) { background: #a4c9ae; }
  .month-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; padding-top: 17px; border-top: 1px dashed var(--line); }
  .stat strong { display: block; font-family: "STSong", "Songti SC", serif; font-size: 23px; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 11px; }

  /* One calendar per task */
  .task-hint { margin: -7px 0 16px; color: var(--muted); font-size: 11px; line-height: 1.6; }
  .task-calendars { display: grid; gap: 13px; }
  .task-calendar-card { border: 1px solid #e9e2d4; border-radius: 15px; padding: 12px 12px 10px; background: #fbf8f0; transition: border-color .2s, box-shadow .2s; }
  .task-calendar-card.active { border-color: #aac3b1; background: #fffdf8; box-shadow: 0 3px 14px rgba(47, 93, 70, .07); }
  .task-card-head { display: flex; align-items: center; justify-content: space-between; gap: 9px; margin-bottom: 8px; }
  .task-title { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .task-dot { width: 6px; height: 6px; flex: none; border-radius: 50%; background: var(--orange); }
  .task-calendar-card:nth-child(3n + 2) .task-dot { background: #6c8e70; }
  .task-calendar-card:nth-child(3n + 3) .task-dot { background: #b99a55; }
  .task-name { font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
  .task-month-meta { flex: none; color: var(--muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  .task-calendar-card .weekdays { margin: 0 0 4px; gap: 3px; }
  .task-calendar-card .weekdays span { font-size: 9px; padding: 0; }
  .task-calendar-card .days { gap: 3px; }
  .task-calendar-card .day { height: 29px; min-height: 29px; aspect-ratio: auto; border-radius: 8px; font-size: 10px; gap: 2px; padding: 2px 1px; }
  .task-calendar-card .day.has-record::before { inset: 2px; border-radius: 6px; }
  .task-calendar-card .day-marks { height: 3px; gap: 1.5px; }
  .task-calendar-card .day-mark { width: 2px; height: 2px; }
  .task-calendar-card .day-count { font-size: 7px; }
  .task-calendar-card .day.outside { cursor: default; }
  .task-calendar-card .day.outside:hover { background: transparent; }
  .task-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed #e7dfd0; color: var(--muted); font-size: 10px; }
  .task-all-btn { border: 0; background: transparent; padding: 0; color: var(--forest); font-size: 10px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; white-space: nowrap; }
  .task-all-btn:hover { color: var(--orange); }
  .task-summary { margin-top: 15px; padding-top: 13px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 11px; line-height: 1.6; }
  .task-empty { padding: 22px 8px; text-align: center; color: var(--muted); font-size: 12px; line-height: 1.8; border: 1px dashed var(--line); border-radius: 13px; }

  /* Records */
  .records-card { min-height: 190px; }
  .record-count { display: inline-grid; place-items: center; min-width: 25px; height: 21px; padding: 0 7px; border-radius: 999px; background: var(--orange-soft); color: #a34f26; font-size: 11px; font-weight: 700; margin-left: 6px; vertical-align: 2px; }
  .record-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .record-group { background: #faf7ef; border: 1px solid #eee7d9; border-radius: 15px; overflow: hidden; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }
  .group-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 13px; background: #f4efe2; border-bottom: 1px solid #eae2d2; }
  .group-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .group-dot { width: 7px; height: 7px; flex: none; border-radius: 50%; background: var(--orange); }
  .record-group:nth-child(3n + 2) .group-dot { background: #6c8e70; }
  .record-group:nth-child(3n + 3) .group-dot { background: #b99a55; }
  .group-name { font-size: 13px; font-weight: 700; overflow-wrap: anywhere; }
  .group-meta { flex: none; font-size: 10px; color: var(--muted); background: #fffaf0; border: 1px solid #e9e0cf; border-radius: 999px; padding: 2px 7px; }
  .segments { list-style: none; margin: 0; padding: 0; }
  .segment { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; padding: 9px 12px; }
  .segment + .segment { border-top: 1px dashed #e8dfcf; }
  .segment-meta { font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .segment-right { display: flex; align-items: center; gap: 8px; }
  .duration { font-family: "Cascadia Mono", Consolas, monospace; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .delete-btn { border: 0; background: transparent; color: #b6aa96; cursor: pointer; font-size: 16px; line-height: 1; padding: 4px; border-radius: 6px; }
  .delete-btn:hover { color: #b34c32; background: #f4e5de; }
  .delete-btn.armed { font-size: 10px; font-weight: 700; color: #a84127; background: #f4ded4; padding: 4px 7px; white-space: nowrap; }
  .empty { padding: 26px 10px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.8; }
  .empty .empty-mark { display: block; font-family: "STSong", "Songti SC", serif; font-size: 28px; color: #c5bca9; margin-bottom: 4px; }
  .record-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 15px; color: var(--muted); font-size: 11px; }
  .filter-clear { border: 0; background: transparent; color: var(--forest); font-size: 11px; cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px; display: none; }
  .filter-clear.show { display: inline; }

  /* Backup */
  .backup-bar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 10px; margin: 0 0 14px; padding: 9px 11px; border: 1px dashed #ddd3c0; border-radius: 11px; background: #fbf7ed; }
  .backup-note { color: var(--muted); font-size: 10px; line-height: 1.4; }
  .backup-actions { display: flex; gap: 6px; flex: none; }
  .backup-btn { border: 1px solid #d8cebb; background: #fffdf8; color: var(--forest); border-radius: 8px; padding: 5px 9px; font-size: 10px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .backup-btn:hover { border-color: #adc2b1; background: #f3f8f2; }
  .backup-btn:disabled { opacity: .4; cursor: not-allowed; }

  .modal-backdrop { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(30, 39, 32, .42); backdrop-filter: blur(3px); }
  .modal-backdrop[hidden] { display: none; }
  .modal-panel { width: min(430px, 100%); background: var(--card); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 70px rgba(30, 39, 32, .22); padding: 25px; }
  .modal-panel .eyebrow { margin-bottom: 5px; }
  .modal-panel h2 { margin: 0 0 12px; font-family: "STSong", "Songti SC", serif; font-size: 24px; letter-spacing: .04em; }
  .modal-copy { margin: 0 0 8px; font-size: 13px; line-height: 1.75; color: #59655c; }
  .modal-warning { margin: 0 0 20px; font-size: 11px; line-height: 1.65; color: #a04a2d; background: #fbede5; border-radius: 9px; padding: 8px 10px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .modal-btn { border-radius: 9px; border: 1px solid #d9d0bf; background: transparent; padding: 8px 12px; font-size: 11px; font-weight: 600; cursor: pointer; }
  .modal-btn:hover { background: #f4efe4; }
  .modal-btn.merge { border-color: #9db6a2; color: var(--forest); background: #edf4ed; }
  .modal-btn.replace { border-color: #d8a894; color: #9c4328; background: #fbede5; }
  .modal-btn.replace:hover { background: #f7ddd0; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 16px); background: #24342b; color: #f8f4e9; padding: 10px 17px; border-radius: 11px; font-size: 12px; box-shadow: 0 10px 28px rgba(0,0,0,.2); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 820px) {
    .app { padding: 26px 15px 50px; }
    .layout { grid-template-columns: 1fr; }
    header { align-items: center; }
    .today-stamp strong { font-size: 24px; }
    .card { padding: 21px; border-radius: 19px; }
    .timer-display { margin: 28px 0 6px; }
  }
  @media (max-width: 420px) {
    .subtitle { font-size: 12px; }
    .today-stamp { display: none; }
    .input-wrap { flex-direction: column; }
    .btn { padding: 12px 16px; }
    .day { min-height: 37px; border-radius: 9px; }
    .card { padding: 18px; }
    .card-head { margin-bottom: 14px; }
    .running-actions { gap: 7px; }
    .running-actions .btn { padding: 12px 10px; }
    #pauseBtn { min-width: 56px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <p class="eyebrow">TIME CHECK-IN</p>
      <h1>时间打卡簿</h1>
      <p class="subtitle">一次只做一件事，完成后单独记下时长。每件事都有自己的一本打卡日历。</p>
    </div>
    <div class="today-stamp">
      <strong id="headerDay">--</strong>
      <span id="headerWeek">----</span>
    </div>
  </header>

  <main class="layout">
    <div class="column">
      <section class="card timer-card" id="timerCard" aria-label="计时器">
        <div class="timer-top">
          <span class="status"><span class="status-dot"></span><span id="statusText">等待开始</span></span>
          <span class="hint" style="font-size:11px;color:rgba(248,244,233,.45)">最小记录单位：秒</span>
        </div>
        <div class="timer-display" id="timerDisplay" aria-live="off">00:00:00</div>
        <div class="timer-task" id="timerTask">先写下要做的事，再按下开始。</div>

        <form class="timer-form" id="timerForm">
          <div id="idleControls">
            <div class="input-wrap">
              <input class="task-input" id="taskInput" type="text" maxlength="40" placeholder="这件事是什么？例如：读 20 页书" autocomplete="off" aria-label="事情名称">
              <button class="btn btn-light" type="button" id="startBtn">开始计时</button>
            </div>
            <div class="quick" id="quickPicks" aria-label="最近做过的件事"></div>
          </div>
          <div id="runningControls" hidden>
            <div class="running-actions">
              <button class="btn btn-light" type="button" id="finishBtn">完成并记录</button>
              <button class="btn btn-ghost" type="button" id="pauseBtn" title="暂停后时长不再增加">暂停</button>
              <button class="btn btn-ghost" type="button" id="discardBtn" title="不记录这段时长">放弃</button>
            </div>
          </div>
        </form>
        <div class="saved-tip" id="savedTip"></div>
      </section>

      <section class="card records-card" aria-label="记录明细">
        <div class="card-head">
          <h2>记录明细<span class="record-count" id="recordCount">0</span></h2>
          <span class="hint" id="listRange">今天</span>
        </div>
        <div class="backup-bar">
          <span class="backup-note">换设备或重装浏览器前，先导出备份。</span>
          <div class="backup-actions">
            <button class="backup-btn" id="exportBtn" type="button">导出备份</button>
            <button class="backup-btn" id="importBtn" type="button">导入备份</button>
            <input id="importFile" type="file" accept=".json,application/json" hidden>
          </div>
        </div>
        <ul class="record-list" id="recordList"></ul>
        <div class="record-foot">
          <span id="recordFoot">每段时长单独记录，不合并。</span>
          <button class="filter-clear" id="filterClear" type="button">查看全部</button>
        </div>
      </section>
    </div>

    <div class="column">
      <section class="card tasks-card" aria-label="任务打卡日历">
        <div class="card-head">
          <h2>任务打卡日历</h2>
          <div class="calendar-nav">
            <button class="icon-btn" id="prevMonth" type="button" aria-label="上个月">‹</button>
            <span class="month-label" id="monthLabel"></span>
            <button class="icon-btn" id="nextMonth" type="button" aria-label="下个月">›</button>
          </div>
        </div>
        <p class="task-hint">每个任务都有自己独立的打卡月历；颜色越深表示当天段数越多。点日期只看这件事的记录。</p>
        <div class="task-calendars" id="taskCalendars"></div>
        <div class="task-summary" id="monthSummary"></div>
      </section>
    </div>
  </main>
</div>
<div class="modal-backdrop" id="importModal" hidden>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="importTitle" aria-describedby="importSummary">
    <p class="eyebrow">RESTORE BACKUP</p>
    <h2 id="importTitle">导入备份</h2>
    <p class="modal-copy" id="importSummary"></p>
    <p class="modal-warning">「覆盖现有」会替换当前全部记录。建议先导出当前记录，再执行覆盖。</p>
    <div class="modal-actions">
      <button class="modal-btn" id="importCancel" type="button">取消</button>
      <button class="modal-btn merge" id="importMerge" type="button">合并导入</button>
      <button class="modal-btn replace" id="importReplace" type="button">覆盖现有</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  'use strict';

  const STORE_KEY = 'time-checkin-v1';
  const $ = (id) => document.getElementById(id);

  // 若页面脚本出错，直接把原因显示在计时卡片上，方便排查。
  window.addEventListener('error', (event) => {
    const tip = document.getElementById('savedTip');
    if (tip) {
      tip.textContent = `脚本出错：${event.message}`;
      tip.style.color = '#ffb8a4';
    }
  });
  const pad = (n) => String(n).padStart(2, '0');
  const dateKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const uid = () => (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);

  let state = { records: [], running: null, selectedDate: dateKey(), selectedTask: null, favorites: [], hiddenRecent: [] };
  let viewMonth = new Date();
  viewMonth.setDate(1);
  let timerHandle = null;
  let toastHandle = null;

  try {
    const saved = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    if (Array.isArray(saved.records)) state.records = saved.records.filter(r => r && r.name && Number.isFinite(r.seconds) && r.start);
    if (Array.isArray(saved.favorites)) state.favorites = [...new Set(saved.favorites.filter(n => typeof n === 'string' && n.trim()).map(n => n.trim()))];
    if (Array.isArray(saved.hiddenRecent)) state.hiddenRecent = [...new Set(saved.hiddenRecent.filter(n => typeof n === 'string' && n.trim()).map(n => n.trim()))];
    if (saved.running && saved.running.name && Number.isFinite(saved.running.startedAt)) {
      const running = saved.running;
      if (!Number.isFinite(running.accumulatedMs)) running.accumulatedMs = 0;
      if (!running.pausedAt) {
        if (!Number.isFinite(running.resumedAt)) running.resumedAt = running.startedAt;
      } else {
        running.resumedAt = null;
      }
      state.running = running;
    }
  } catch (err) { console.warn('读取本地记录失败', err); }

  const activeElapsed = (running) => {
    const accumulated = Number.isFinite(running.accumulatedMs) ? running.accumulatedMs : 0;
    if (running.pausedAt) return Math.max(0, accumulated);
    const resumedAt = Number.isFinite(running.resumedAt) ? running.resumedAt : running.startedAt;
    return accumulated + Math.max(0, Date.now() - resumedAt);
  };

  const persist = () => {
    try {
      localStorage.setItem(STORE_KEY, JSON.stringify({
        records: state.records,
        running: state.running,
        favorites: state.favorites,
        hiddenRecent: state.hiddenRecent
      }));
    } catch (err) { toast('浏览器存储不可用，刷新后可能丢失记录'); }
  };

  const fmtClock = (ms) => {
    const total = Math.max(0, Math.floor(ms / 1000));
    return `${pad(Math.floor(total / 3600))}:${pad(Math.floor(total % 3600 / 60))}:${pad(total % 60)}`;
  };

  const fmtDuration = (seconds) => {
    if (seconds < 60) return `${seconds} 秒`;
    const h = Math.floor(seconds / 3600);
    const m = Math.floor(seconds % 3600 / 60);
    const s = seconds % 60;
    if (!h) return s ? `${m} 分 ${s} 秒` : `${m} 分钟`;
    return `${h} 小时 ${pad(m)} 分`;
  };

  const fmtTime = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '--:--' : `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  const recordsOf = (key) => state.records
    .filter(r => r.date === key)
    .sort((a, b) => new Date(b.start) - new Date(a.start));

  const toast = (message, duration = 2400) => {
    const el = $('toast');
    el.textContent = message;
    el.classList.add('show');
    clearTimeout(toastHandle);
    toastHandle = setTimeout(() => el.classList.remove('show'), duration);
  };

  /* ---------- 备份与恢复 ---------- */
  const MAX_IMPORT_BYTES = 5 * 1024 * 1024;
  let pendingImport = null;
  let importReturnFocus = null;

  const isValidDateKey = (key) => {
    const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key || '');
    if (!match) return false;
    return dateKey(new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]))) === key;
  };

  const fmtDateKey = (key) => {
    const [, y, m, d] = key.match(/^(\d{4})-(\d{2})-(\d{2})$/) || [];
    return y ? `${y}/${m}/${d}` : key;
  };

  function normalizeImportedRecord(raw) {
    if (!raw || typeof raw !== 'object') return null;
    const name = typeof raw.name === 'string' ? raw.name.trim().slice(0, 40) : '';
    const seconds = Math.round(Number(raw.seconds));
    if (!name || !Number.isFinite(seconds) || seconds < 1) return null;
    const start = new Date(raw.start);
    const end = new Date(raw.end || raw.start);
    if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end < start) return null;
    const date = isValidDateKey(raw.date) ? raw.date : dateKey(end);
    const id = typeof raw.id === 'string' && raw.id.trim() ? raw.id.trim() : uid();
    return { id, name, start: start.toISOString(), end: end.toISOString(), date, seconds };
  }

  function parseBackupText(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      throw new Error('文件不是有效的 JSON');
    }
    const list = Array.isArray(data) ? data : (data && Array.isArray(data.records) ? data.records : null);
    if (!list) throw new Error('文件里没有找到记录列表');
    if (!list.length) throw new Error('备份里没有任何记录');
    if (list.length > 50000) throw new Error('备份记录过多');

    const byId = new Map();
    let invalid = 0;
    list.forEach(raw => {
      const record = normalizeImportedRecord(raw);
      if (!record) { invalid++; return; }
      if (!byId.has(record.id)) byId.set(record.id, record);
    });
    const records = [...byId.values()];
    if (!records.length) throw new Error('备份里没有可识别的有效记录');
    return { records, invalid, duplicateIds: list.length - invalid - records.length };
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ''));
      reader.onerror = () => reject(new Error('文件读取失败'));
      reader.readAsText(file);
    });
  }

  function downloadBackup() {
    if (!state.records.length) { toast('还没有记录可以导出'); return; }
    const exportedAt = new Date();
    const payload = {
      app: 'time-checkin',
      version: 1,
      exportedAt: exportedAt.toISOString(),
      records: state.records.map(record => ({
        id: record.id,
        name: record.name,
        start: record.start,
        end: record.end,
        date: record.date,
        seconds: record.seconds
      }))
    };
    try {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `时间打卡簿-备份-${dateKey()}-${pad(exportedAt.getHours())}${pad(exportedAt.getMinutes())}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      toast(`已导出 ${state.records.length} 段记录`);
    } catch (err) {
      toast('导出失败，请换用 Chrome 或 Edge 浏览器', 4000);
    }
  }

  function openImportModal(records, fileName) {
    const existingIds = new Set(state.records.map(record => record.id));
    const duplicates = records.filter(record => existingIds.has(record.id)).length;
    const taskCount = new Set(records.map(record => record.name.trim())).size;
    const dates = records.map(record => record.date).sort();
    const invalid = pendingImport && pendingImport.invalid ? ` 另有 ${pendingImport.invalid} 条无效记录会被忽略。` : '';
    $('importSummary').textContent = `「${fileName}」中有 ${records.length} 段记录，来自 ${taskCount} 个任务，日期从 ${fmtDateKey(dates[0])} 到 ${fmtDateKey(dates[dates.length - 1])}。其中 ${duplicates} 条当前已存在，合并导入时会跳过。${invalid}`;
    pendingImport.records = records;
    pendingImport.fileName = fileName;
    importReturnFocus = document.activeElement;
    $('importModal').hidden = false;
    document.body.style.overflow = 'hidden';
    $('importMerge').focus();
  }

  function closeImportModal() {
    $('importModal').hidden = true;
    document.body.style.overflow = '';
    pendingImport = null;
    if (importReturnFocus && importReturnFocus.isConnected) importReturnFocus.focus();
    importReturnFocus = null;
  }

  function latestRecordMonth(records) {
    return records.reduce((latest, record) => {
      const time = new Date(record.start).getTime();
      return Number.isFinite(time) && time > latest ? time : latest;
    }, 0);
  }

  function applyImport(mode) {
    if (!pendingImport || !pendingImport.records.length) return;
    const imported = pendingImport.records;
    let count = 0;

    if (mode === 'replace') {
      state.records = imported;
      count = imported.length;
    } else {
      const ids = new Set(state.records.map(record => record.id));
      imported.forEach(record => {
        if (!ids.has(record.id)) {
          ids.add(record.id);
          state.records.push(record);
          count++;
        }
      });
      if (!count) {
        closeImportModal();
        toast('备份中的记录都已存在，无需合并', 3600);
        return;
      }
    }

    state.selectedTask = null;
    state.selectedDate = null;
    state.running = state.running || null;
    const latest = latestRecordMonth(state.records);
    if (latest) {
      const date = new Date(latest);
      viewMonth = new Date(date.getFullYear(), date.getMonth(), 1);
    }
    persist();
    renderAll();
    closeImportModal();
    toast(mode === 'replace' ? `已恢复 ${count} 段记录` : `已合并导入 ${count} 段记录`, 3200);
  }

  $('exportBtn').addEventListener('click', downloadBackup);
  $('importBtn').addEventListener('click', () => $('importFile').click());
  $('importFile').addEventListener('change', async (event) => {
    const file = event.target.files && event.target.files[0];
    event.target.value = '';
    if (!file) return;
    if (file.size > MAX_IMPORT_BYTES) {
      toast('备份文件过大，无法导入', 4000);
      return;
    }
    try {
      const text = await readFileAsText(file);
      const parsed = parseBackupText(text);
      pendingImport = parsed;
      openImportModal(parsed.records, file.name);
    } catch (err) {
      pendingImport = null;
      toast(`导入失败：${err.message}`, 4500);
    }
  });
  $('importCancel').addEventListener('click', closeImportModal);
  $('importMerge').addEventListener('click', () => applyImport('merge'));
  $('importReplace').addEventListener('click', () => applyImport('replace'));
  $('importModal').addEventListener('click', (event) => {
    if (event.target === $('importModal')) closeImportModal();
  });
  document.addEventListener('keydown', (event) => {
    if ($('importModal').hidden) return;
    if (event.key === 'Escape') { closeImportModal(); return; }
    if (event.key !== 'Tab') return;
    const focusable = [...$('importModal').querySelectorAll('button')];
    if (!focusable.length) return;
    const first = focusable[0];
    const last = focusable[focusable.length - 1];
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });

  function renderTimer() {
    const card = $('timerCard');
    const running = state.running;
    const paused = Boolean(running && running.pausedAt);
    card.classList.toggle('is-running', Boolean(running));
    card.classList.toggle('is-paused', paused);
    $('idleControls').hidden = Boolean(running);
    $('runningControls').hidden = !running;
    $('statusText').textContent = running ? (paused ? '已暂停' : '计时中') : '等待开始';
    $('timerTask').textContent = running ? running.name : '先写下要做的事，再按下开始。';
    $('pauseBtn').textContent = paused ? '继续' : '暂停';
    $('pauseBtn').title = paused ? '继续计时' : '暂停后时长不再增加';
    $('pauseBtn').setAttribute('aria-pressed', String(paused));
    if (running) {
      $('timerDisplay').textContent = fmtClock(paused ? running.accumulatedMs : activeElapsed(running));
      document.title = paused ? `已暂停 · ${running.name}` : `${fmtClock(activeElapsed(running))} · ${running.name}`;
      $('savedTip').textContent = paused
        ? '已暂停，这段时长不会再增加；刷新页面也会保留。'
        : '计时会保存在本机，刷新页面也不会中断。';
    } else {
      $('timerDisplay').textContent = '00:00:00';
      document.title = '时间打卡簿';
      $('savedTip').textContent = state.records.length
        ? `已经留下 ${state.records.length} 段专注记录。`
        : '记录只保存在这台设备的浏览器里。';
    }
    renderQuickPicks();
  }

  function renderQuickPicks() {
    const wrap = $('quickPicks');
    if (state.running) { wrap.innerHTML = ''; return; }

    const allNames = taskNames();
    const existing = new Set(allNames);
    state.favorites = state.favorites.filter(name => existing.has(name));
    state.hiddenRecent = state.hiddenRecent.filter(name => existing.has(name));
    const hidden = new Set(state.hiddenRecent);
    const favorites = state.favorites.filter(name => !hidden.has(name));
    const favoriteSet = new Set(favorites);
    const recent = allNames.filter(name => !favoriteSet.has(name) && !hidden.has(name)).slice(0, 4);

    if (!favorites.length && !recent.length) { wrap.innerHTML = ''; return; }

    const makeRow = (labelText, names, isFavoriteRow) => {
      const row = document.createElement('div');
      row.className = 'quick-row';
      const label = document.createElement('span');
      label.className = 'quick-label';
      label.textContent = labelText;
      row.appendChild(label);

      names.forEach(name => {
        const item = document.createElement('span');
        item.className = 'quick-item' + (isFavoriteRow ? ' is-favorite' : '');

        const nameBtn = document.createElement('button');
        nameBtn.type = 'button';
        nameBtn.className = 'quick-name';
        nameBtn.textContent = name;
        nameBtn.title = `使用「${name}」开始计时`;
        nameBtn.addEventListener('click', () => { $('taskInput').value = name; $('taskInput').focus(); });
        item.appendChild(nameBtn);

        const star = document.createElement('button');
        star.type = 'button';
        const isFavorite = state.favorites.includes(name);
        star.className = 'quick-action star' + (isFavorite ? ' on' : '');
        star.textContent = isFavorite ? '★' : '☆';
        star.title = isFavorite ? '取消收藏' : '收藏这件事';
        star.setAttribute('aria-label', `${isFavorite ? '取消收藏' : '收藏'}：${name}`);
        star.addEventListener('click', () => {
          if (state.favorites.includes(name)) {
            state.favorites = state.favorites.filter(n => n !== name);
            toast(`已取消收藏「${name}」`);
          } else {
            state.favorites = [name, ...state.favorites.filter(n => n !== name)];
            state.hiddenRecent = state.hiddenRecent.filter(n => n !== name);
            toast(`已收藏「${name}」`);
          }
          persist();
          renderQuickPicks();
        });
        item.appendChild(star);

        const remove = document.createElement('button');
        remove.type = 'button';
        remove.className = 'quick-action remove';
        remove.textContent = '×';
        remove.title = '从最近中移除（不会删除记录）';
        remove.setAttribute('aria-label', `从最近中移除：${name}`);
        remove.addEventListener('click', () => {
          state.hiddenRecent = [name, ...state.hiddenRecent.filter(n => n !== name)];
          state.favorites = state.favorites.filter(n => n !== name);
          persist();
          renderQuickPicks();
          toast('已从最近移除，历史记录仍保留');
        });
        item.appendChild(remove);
        row.appendChild(item);
      });
      return row;
    };

    const rows = [];
    if (favorites.length) rows.push(makeRow('收藏', favorites, true));
    if (recent.length) rows.push(makeRow('最近', recent, false));
    wrap.replaceChildren(...rows);
  }

  function taskNames() {
    const names = [];
    const seen = new Set();
    [...state.records]
      .sort((a, b) => new Date(b.start) - new Date(a.start))
      .forEach(record => {
        const name = record.name.trim();
        if (!seen.has(name)) {
          seen.add(name);
          names.push(name);
        }
      });
    return names;
  }

  function renderTaskCalendars() {
    const year = viewMonth.getFullYear();
    const month = viewMonth.getMonth();
    const monthPrefix = `${year}-${pad(month + 1)}`;
    $('monthLabel').textContent = `${year} 年 ${month + 1} 月`;

    const names = taskNames();
    const wrap = $('taskCalendars');
    wrap.innerHTML = '';

    if (!names.length) {
      wrap.innerHTML = '<div class="task-empty">完成任务后，这里会出现这件事专属的打卡月历。<br>每件事各自一本，互不混在一起。</div>';
      $('monthSummary').textContent = '本月还没有打卡记录。';
      return;
    }

    const firstDay = new Date(year, month, 1);
    const leading = (firstDay.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const cells = Math.ceil((leading + daysInMonth) / 7) * 7;
    const todayKey = dateKey();

    names.forEach(name => {
      const allTaskRecords = state.records.filter(r => r.name.trim() === name);
      const monthRecords = allTaskRecords.filter(r => r.date.startsWith(monthPrefix));
      const monthDayCount = new Set(monthRecords.map(r => r.date)).size;
      const countsByDate = new Map();
      allTaskRecords.forEach(record => {
        countsByDate.set(record.date, (countsByDate.get(record.date) || 0) + 1);
      });

      const card = document.createElement('article');
      card.className = 'task-calendar-card';
      if (state.selectedTask === name) card.classList.add('active');

      const head = document.createElement('div');
      head.className = 'task-card-head';
      const title = document.createElement('div');
      title.className = 'task-title';
      const dot = document.createElement('span');
      dot.className = 'task-dot';
      const taskName = document.createElement('span');
      taskName.className = 'task-name';
      taskName.textContent = name;
      title.append(dot, taskName);
      const taskTotalSeconds = allTaskRecords.reduce((sum, record) => sum + record.seconds, 0);
      const meta = document.createElement('span');
      meta.className = 'task-month-meta';
      meta.textContent = `共 ${allTaskRecords.length} 段 · 总 ${fmtDuration(taskTotalSeconds)}`;
      meta.title = `累计时长 ${fmtDuration(taskTotalSeconds)}`;
      head.append(title, meta);

      const weekdays = document.createElement('div');
      weekdays.className = 'weekdays';
      weekdays.setAttribute('aria-hidden', 'true');
      ['一', '二', '三', '四', '五', '六', '日'].forEach(label => {
        const span = document.createElement('span');
        span.textContent = label;
        weekdays.appendChild(span);
      });

      const grid = document.createElement('div');
      grid.className = 'days';
      grid.setAttribute('role', 'group');
      grid.setAttribute('aria-label', `${name}的${month + 1}月打卡日历`);

      for (let i = 0; i < cells; i++) {
        let dayNum, cellDate, outside = false;
        if (i < leading) {
          dayNum = prevDays - leading + i + 1;
          cellDate = new Date(year, month - 1, dayNum);
          outside = true;
        } else if (i >= leading + daysInMonth) {
          dayNum = i - leading - daysInMonth + 1;
          cellDate = new Date(year, month + 1, dayNum);
          outside = true;
        } else {
          dayNum = i - leading + 1;
          cellDate = new Date(year, month, dayNum);
        }
        const key = dateKey(cellDate);
        const count = countsByDate.get(key) || 0;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day';
        if (outside) {
          btn.classList.add('outside');
          btn.disabled = true;
        }
        if (key === todayKey) btn.classList.add('today');
        if (state.selectedTask === name && key === state.selectedDate) btn.classList.add('selected');
        if (count) btn.classList.add('has-record', `level-${Math.min(count, 3)}`);
        btn.setAttribute('aria-label', `${cellDate.getMonth() + 1}月${dayNum}日，${name}${count ? `，${count} 段记录` : '，无记录'}`);
        const marks = count
          ? `<span class="day-marks">${'<i class="day-mark"></i>'.repeat(Math.min(count, 3))}</span>`
          : '';
        btn.innerHTML = `<span class="day-num">${dayNum}</span>${marks}`;
        if (!outside) {
          btn.addEventListener('click', () => {
            state.selectedTask = name;
            state.selectedDate = key;
            renderTaskCalendars();
            renderRecords();
          });
        }
        grid.appendChild(btn);
      }

      const foot = document.createElement('div');
      foot.className = 'task-card-foot';
      const footMeta = document.createElement('span');
      footMeta.textContent = `本月 ${monthDayCount} 天打卡 · ${monthRecords.length} 段`;
      const allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.className = 'task-all-btn';
      allBtn.textContent = '查看全部记录';
      allBtn.setAttribute('aria-label', `查看${name}的全部记录`);
      allBtn.addEventListener('click', () => {
        state.selectedTask = name;
        state.selectedDate = null;
        renderTaskCalendars();
        renderRecords();
      });
      foot.append(footMeta, allBtn);

      card.append(head, weekdays, grid, foot);
      wrap.appendChild(card);
    });

    const monthRecords = state.records.filter(r => r.date.startsWith(monthPrefix));
    const days = new Set(monthRecords.map(r => r.date)).size;
    $('monthSummary').textContent = `本月共 ${days} 天打卡、${monthRecords.length} 段记录，分布在 ${names.length} 个任务的日历上。`;
  }

  function renderRecords() {
    const list = $('recordList');
    const all = !state.selectedTask && !state.selectedDate;
    let records = [...state.records];

    if (state.selectedTask) {
      records = records.filter(r => r.name.trim() === state.selectedTask);
    }
    if (state.selectedDate) {
      records = records.filter(r => r.date === state.selectedDate);
    }
    records.sort((a, b) => new Date(b.start) - new Date(a.start));

    const dateLabel = state.selectedDate ? (() => {
      const [, m, d] = state.selectedDate.split('-').map(Number);
      return `${m} 月 ${d} 日`;
    })() : null;
    const rangeLabel = [state.selectedTask, dateLabel].filter(Boolean).join(' · ') || '全部记录';

    $('recordCount').textContent = records.length;
    $('exportBtn').disabled = state.records.length === 0;
    $('listRange').textContent = rangeLabel;
    $('listRange').title = rangeLabel;
    $('filterClear').classList.toggle('show', !all);
    if (state.selectedTask) {
      $('recordFoot').textContent = state.selectedDate
        ? `「${state.selectedTask}」这一天共 ${records.length} 段，每段单独保留。`
        : `「${state.selectedTask}」共 ${records.length} 段，按时间倒序排列。`;
    } else {
      $('recordFoot').textContent = all
        ? `共 ${records.length} 段，同名记录归在一起，每段时长仍单独保留。`
        : `这一天共 ${records.length} 段，同名记录归在一起。`;
    }

    if (!records.length) {
      list.innerHTML = `<li class="empty"><span class="empty-mark">○</span>${all ? '还没有任何记录。<br>去开始第一段专注吧。' : '这个范围还没有记录。<br>换个日期看看，或现在开始计时。'}</li>`;
      return;
    }

    // 同名记录归为一组，但组内每一段仍然独立保留。
    const groups = new Map();
    records.forEach(record => {
      const key = record.name.trim();
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(record);
    });

    list.innerHTML = '';
    groups.forEach((items, groupName) => {
      const group = document.createElement('li');
      group.className = 'record-group';

      const head = document.createElement('div');
      head.className = 'group-head';
      const title = document.createElement('div');
      title.className = 'group-title';
      const dot = document.createElement('span');
      dot.className = 'group-dot';
      const name = document.createElement('span');
      name.className = 'group-name';
      name.textContent = groupName;
      title.append(dot, name);
      const totalSeconds = items.reduce((sum, record) => sum + record.seconds, 0);
      const count = document.createElement('span');
      count.className = 'group-meta';
      count.textContent = `${items.length} 段 · 总 ${fmtDuration(totalSeconds)}`;
      count.title = `当前列出的 ${items.length} 段记录，合计 ${fmtDuration(totalSeconds)}`;
      head.append(title, count);

      const segments = document.createElement('ul');
      segments.className = 'segments';
      items.forEach(record => {
        const segment = document.createElement('li');
        segment.className = 'segment';
        const meta = document.createElement('div');
        meta.className = 'segment-meta';
        const timeRange = `${fmtTime(record.start)} – ${fmtTime(record.end)}`;
        meta.textContent = all ? `${record.date.replaceAll('-', '/')}  ${timeRange}` : timeRange;

        const duration = document.createElement('span');
        duration.className = 'duration';
        duration.textContent = fmtDuration(record.seconds);
        const del = document.createElement('button');
        del.type = 'button';
        del.className = 'delete-btn';
        del.textContent = '×';
        del.title = '删除这一段记录';
        del.setAttribute('aria-label', `删除记录：${groupName}，${timeRange}`);
        let armed = false;
        let resetHandle = null;
        const reset = () => {
          armed = false;
          clearTimeout(resetHandle);
          if (del.isConnected) {
            del.textContent = '×';
            del.classList.remove('armed');
            del.title = '删除这一段记录';
          }
        };
        del.addEventListener('click', () => {
          if (!armed) {
            armed = true;
            del.textContent = '确认删除';
            del.classList.add('armed');
            del.title = '再次点击确认删除';
            resetHandle = setTimeout(reset, 3000);
            return;
          }
          clearTimeout(resetHandle);
          state.records = state.records.filter(r => r.id !== record.id);
          persist();
          renderAll();
          toast(`已删除「${groupName}」的这段记录`);
        });

        const right = document.createElement('div');
        right.className = 'segment-right';
        right.append(duration, del);
        segment.append(meta, right);
        segments.appendChild(segment);
      });

      group.append(head, segments);
      list.appendChild(group);
    });
  }

  function renderHeader() {
    const now = new Date();
    $('headerDay').textContent = pad(now.getDate());
    $('headerWeek').textContent = `星期${'日一二三四五六'[now.getDay()]} · ${now.getFullYear()}.${pad(now.getMonth() + 1)}`;
  }

  function renderAll() {
    if (state.selectedTask && !state.records.some(r => r.name.trim() === state.selectedTask)) {
      state.selectedTask = null;
    }
    renderHeader();
    renderTimer();
    renderTaskCalendars();
    renderRecords();
  }

  function startTicking() {
    clearInterval(timerHandle);
    if (!state.running || state.running.pausedAt) return;
    timerHandle = setInterval(() => {
      if (!state.running || state.running.pausedAt) return;
      const elapsed = activeElapsed(state.running);
      $('timerDisplay').textContent = fmtClock(elapsed);
      document.title = `${fmtClock(elapsed)} · ${state.running.name}`;
    }, 1000);
  }

  const discardBtn = $('discardBtn');
  let discardArmed = false;
  let discardResetHandle = null;
  function resetDiscard() {
    discardArmed = false;
    clearTimeout(discardResetHandle);
    discardBtn.textContent = '放弃';
    discardBtn.classList.remove('armed');
  }

  function beginTimer() {
    if (state.running) return;
    resetDiscard();
    const input = $('taskInput');
    const name = input.value.trim() || '未命名专注';
    const now = Date.now();
    state.running = { name, startedAt: now, accumulatedMs: 0, resumedAt: now, pausedAt: null };
    persist();
    renderTimer();
    startTicking();
    toast('开始计时，专注眼前这一件事');
  }

  function finishTimer() {
    if (!state.running) return;
    const now = Date.now();
    const seconds = Math.max(1, Math.round(activeElapsed(state.running) / 1000));
    const end = new Date(now);
    const record = {
      id: uid(),
      name: state.running.name,
      start: new Date(state.running.startedAt).toISOString(),
      end: end.toISOString(),
      date: dateKey(end),
      seconds
    };
    state.records.push(record);
    state.running = null;
    resetDiscard();
    state.hiddenRecent = state.hiddenRecent.filter(name => name !== record.name.trim());
    state.selectedTask = record.name.trim();
    state.selectedDate = record.date;
    viewMonth = new Date(end.getFullYear(), end.getMonth(), 1);
    clearInterval(timerHandle);
    persist();
    renderAll();
    $('taskInput').value = '';
    $('taskInput').focus();
    toast(`已记录 ${fmtDuration(seconds)} · ${record.name}`);
  }

  // 直接用 click 绑定，避免部分内嵌预览环境拦截表单提交。
  $('startBtn').addEventListener('click', (event) => {
    event.preventDefault();
    beginTimer();
  });
  $('finishBtn').addEventListener('click', (event) => {
    event.preventDefault();
    finishTimer();
  });
  $('timerForm').addEventListener('submit', (event) => {
    event.preventDefault();
    if (state.running) finishTimer();
    else beginTimer();
  });

  $('pauseBtn').addEventListener('click', () => {
    if (!state.running) return;
    if (state.running.pausedAt) {
      state.running.resumedAt = Date.now();
      state.running.pausedAt = null;
      persist();
      renderTimer();
      startTicking();
      toast('继续计时');
      return;
    }
    state.running.accumulatedMs = activeElapsed(state.running);
    state.running.pausedAt = Date.now();
    state.running.resumedAt = null;
    clearInterval(timerHandle);
    persist();
    renderTimer();
    toast('已暂停，时长不会继续增加');
  });

  discardBtn.addEventListener('click', () => {
    if (!state.running) return;
    if (!discardArmed) {
      discardArmed = true;
      discardBtn.textContent = '再按一次放弃';
      discardBtn.classList.add('armed');
      discardResetHandle = setTimeout(resetDiscard, 3000);
      return;
    }
    state.running = null;
    clearInterval(timerHandle);
    resetDiscard();
    persist();
    renderAll();
    $('taskInput').focus();
    toast('已放弃这段计时');
  });

  $('prevMonth').addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1);
    renderTaskCalendars();
  });
  $('nextMonth').addEventListener('click', () => {
    viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
    renderTaskCalendars();
  });
  $('filterClear').addEventListener('click', () => {
    state.selectedTask = null;
    state.selectedDate = null;
    renderTaskCalendars();
    renderRecords();
  });

  // 重新打开页面时，恢复今天的视图与运行中的计时。
  if (state.running) {
    $('taskInput').value = state.running.name;
    startTicking();
  }
  renderAll();
})();
</script>
</body>
</html>
